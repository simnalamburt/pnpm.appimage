name: Release watchtower

on:
  push:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: pnpm version to build (for example, 11.13.1)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-watchtower-${{ inputs.version || 'latest' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      need_build: ${{ steps.release.outputs.need_build }}
    steps:
      - name: Select version and inspect release assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="${REQUESTED_VERSION#v}"
          else
            version="$(
              curl --fail --location --show-error --silent --retry 3 \
                'https://registry.npmjs.org/pnpm/latest' |
                jq --exit-status --raw-output '.version'
            )"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid pnpm version: $version" >&2
            exit 1
          fi

          if [[ -n "$REQUESTED_VERSION" ]]; then
            need_build=true
          else
            assets="$(
              gh release view "v${version}" --repo "$GITHUB_REPOSITORY" \
                --json assets --jq '.assets[].name' 2>/dev/null || true
            )"
            need_build=false
            for arch in x86_64 aarch64; do
              if ! grep --fixed-strings --line-regexp --quiet \
                "pnpm-${arch}.AppImage" <<< "$assets"; then
                need_build=true
              fi
            done
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "need_build=${need_build}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.need_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build ${{ matrix.arch }} AppImage
        run: ./build '${{ needs.check.outputs.version }}' '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v7
        with:
          name: pnpm-${{ matrix.arch }}
          path: pnpm-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.need_build == 'true' && needs.build.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pnpm-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          tag="v${VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$tag" \
              --notes 'This build is automated via GitHub Actions.'
          fi
          gh release upload "$tag" dist/*.AppImage \
            --repo "$GITHUB_REPOSITORY" --clobber
